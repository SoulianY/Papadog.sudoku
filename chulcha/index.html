<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>출차</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="home" hidden>
    <header class="bar">
      <a class="hub" href="../" aria-label="게임 목록">‹</a>
      <h1>출차</h1>
      <span></span>
    </header>
    <p class="intro">블록을 밀어 길을 열고, 노란 블록을 오른쪽 출구로 빼내세요. 블록은 놓인 방향으로만 움직여요.</p>
    <div class="progress">
      <div class="progress-bar"><span></span></div>
      <span class="progress-text"></span>
    </div>
    <button class="continue primary"></button>
    <p class="legend"><span class="sw done"></span>완료 <span class="sw perfect"></span>최소 수로 완료</p>
    <div class="levels"></div>
  </main>

  <main id="play" hidden>
    <header class="bar">
      <button class="back" aria-label="단계 목록">‹</button>
      <div class="title">
        <h1 class="level-title"></h1>
        <span class="level-sub"></span>
      </div>
      <span></span>
    </header>
    <p class="count"><span class="moves">0</span>수</p>
    <div class="board-frame">
      <div class="board"></div>
      <div class="exit" aria-hidden="true">›</div>
    </div>
    <div class="controls">
      <button class="undo">되돌리기</button>
      <button class="reset">처음부터</button>
    </div>
    <div class="win" hidden>
      <div class="win-card">
        <h2>출차 성공!</h2>
        <p class="win-moves"></p>
        <p class="win-note"></p>
        <button class="next primary">다음 단계</button>
        <button class="again">다시 하기</button>
        <button class="to-list">단계 목록</button>
      </div>
    </div>
  </main>
</body>
</html>
