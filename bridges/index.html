<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>다리 놓기</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="home" hidden>
    <header class="bar">
      <a class="hub" href="../" aria-label="게임 목록">‹</a>
      <h1>다리 놓기</h1>
      <span></span>
    </header>
    <ul class="intro">
      <li>섬의 숫자만큼 다리를 연결하세요.</li>
      <li>다리는 가로·세로로만, 두 섬 사이에 최대 2개.</li>
      <li>다리끼리 엇갈릴 수 없고, 모든 섬이 하나로 이어져야 해요.</li>
      <li>섬에서 옆 섬 쪽으로 끌거나, 두 섬 사이를 누르면 다리가 0 → 1 → 2 → 0으로 바뀌어요.</li>
    </ul>
    <div class="progress">
      <div class="progress-bar"><span></span></div>
      <span class="progress-text"></span>
    </div>
    <button class="continue primary"></button>
    <div class="sections"></div>
  </main>

  <main id="play" hidden>
    <header class="bar">
      <button class="back" aria-label="단계 목록">‹</button>
      <div class="title">
        <h1 class="stage-title"></h1>
        <span class="stage-sub"></span>
      </div>
      <span></span>
    </header>
    <p class="status">남은 다리 <b class="left">0</b>개</p>
    <svg class="board" role="img" aria-label="퍼즐 판"></svg>
    <div class="controls">
      <button class="undo">되돌리기</button>
      <button class="reset">처음부터</button>
    </div>
    <div class="win" hidden>
      <div class="win-card">
        <h2>완성!</h2>
        <p>모든 섬이 이어졌어요</p>
        <button class="next primary">다음 단계</button>
        <button class="to-list">단계 목록</button>
      </div>
    </div>
  </main>
</body>
</html>
