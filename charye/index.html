<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2b1f6b">
  <title>차례</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="home" hidden>
    <header class="bar">
      <a class="hub" href="../" aria-label="게임 목록">‹</a>
      <h1>차례</h1>
      <span></span>
    </header>
    <p class="intro">1부터 차례로 누르세요. 누른 칸에는 다음 숫자가 나타나요.</p>
    <div class="progress">
      <div class="progress-bar"><span></span></div>
      <span class="progress-text"></span>
    </div>
    <button class="continue primary"></button>
    <div class="sections"></div>
  </main>

  <main id="play" hidden>
    <header class="bar">
      <button class="back" aria-label="단계 목록">‹</button>
      <div class="title">
        <h1 class="stage-title"></h1>
        <span class="stage-sub"></span>
      </div>
      <button class="retry" aria-label="다시 하기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>
    <section class="status">
      <div><span class="label">다음</span><span class="next-number"></span></div>
      <div><span class="label">시간</span><span class="timer"></span></div>
    </section>
    <p class="stage-best"></p>
    <div class="board"></div>
    <div class="clear" hidden>
      <div class="clear-card">
        <h2>완료!</h2>
        <p class="clear-time"></p>
        <p class="clear-best"></p>
        <button class="next primary">다음 단계</button>
        <button class="again">다시 하기</button>
        <button class="to-list">단계 목록</button>
      </div>
    </div>
  </main>
</body>
</html>
