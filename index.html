<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="파파독 게임">
  <title>파파독 게임</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <main>
    <h1>파파독 게임</h1>
    <nav class="games">
      <a class="card" href="sudoku6/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="6" class="frame"/>
          <path d="M17.3 4v40M30.7 4v40M4 24h40" class="line"/><path d="M24 4v40" class="frame-line"/>
          <text x="10.6" y="17.5" class="digit">2</text><text x="37.4" y="17.5" class="digit">6</text><text x="24" y="38" class="digit accent">4</text>
        </svg>
        <span class="name">스도쿠 6×6</span>
        <span class="desc">작은 판 스도쿠 · 500판</span>
      </a>
      <a class="card" href="sudoku-easy/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="6" class="frame"/>
          <path d="M17.3 4v40M30.7 4v40M4 17.3h40M4 30.7h40" class="line"/>
          <text x="10.6" y="15" class="digit">1</text><text x="24" y="28.4" class="digit">8</text><text x="37.4" y="41.8" class="digit accent">3</text>
        </svg>
        <span class="name">스도쿠 (쉬움)</span>
        <span class="desc">9×9 쉬운 스도쿠 · 1000판</span>
      </a>
      <a class="card" href="sudoku/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="4" width="40" height="40" rx="6" class="frame"/>
          <path d="M17.3 4v40M30.7 4v40M4 17.3h40M4 30.7h40" class="line"/>
          <text x="10.6" y="15" class="digit">5</text><text x="37.4" y="28.4" class="digit">3</text><text x="24" y="41.8" class="digit accent">9</text>
        </svg>
        <span class="name">스도쿠</span>
        <span class="desc">9×9 숫자 퍼즐 · 400판</span>
      </a>
      <a class="card" href="blocks/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="6" y="6" width="11" height="11" rx="3" fill="#e4574f"/><rect x="18.5" y="6" width="11" height="11" rx="3" fill="#e4574f"/>
          <rect x="6" y="18.5" width="11" height="11" rx="3" fill="#e4574f"/>
          <rect x="18.5" y="31" width="11" height="11" rx="3" fill="#3a9bd6"/><rect x="31" y="31" width="11" height="11" rx="3" fill="#3a9bd6"/>
          <rect x="31" y="18.5" width="11" height="11" rx="3" fill="#4cae6e"/>
        </svg>
        <span class="name">블록 퍼즐</span>
        <span class="desc">블록을 놓아 줄 지우기</span>
      </a>
      <a class="card" href="itda/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <polyline points="12,12 36,12 36,24 12,24 12,36 36,36" fill="none" stroke="#e2583e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="6" class="dot"/><circle cx="36" cy="36" r="6" class="dot"/>
          <text x="12" y="14.6" class="num">1</text><text x="36" y="38.6" class="num">2</text>
        </svg>
        <span class="name">잇다</span>
        <span class="desc">숫자 순서대로 한붓 잇기 · 500판</span>
      </a>
      <a class="card" href="drop/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="18.5" y="4" width="11" height="11" rx="3" fill="#a45bd6"/>
          <rect x="6" y="15.5" width="11" height="11" rx="3" fill="#a45bd6"/><rect x="18.5" y="15.5" width="11" height="11" rx="3" fill="#a45bd6"/><rect x="31" y="15.5" width="11" height="11" rx="3" fill="#a45bd6"/>
          <rect x="6" y="33" width="11" height="11" rx="3" fill="#f0a032"/><rect x="18.5" y="33" width="11" height="11" rx="3" fill="#3a9bd6"/><rect x="31" y="33" width="11" height="11" rx="3" fill="#4cae6e"/>
        </svg>
        <span class="name">낙하</span>
        <span class="desc">떨어지는 블록으로 줄 채우기</span>
      </a>
      <a class="card" href="charye/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="4" width="12" height="12" rx="3" class="tile"/><rect x="18" y="4" width="12" height="12" rx="3" class="tile"/><rect x="32" y="4" width="12" height="12" rx="3" class="tile"/>
          <rect x="4" y="18" width="12" height="12" rx="3" class="tile"/><rect x="18" y="18" width="12" height="12" rx="3" class="tile hot"/><rect x="32" y="18" width="12" height="12" rx="3" class="tile"/>
          <rect x="4" y="32" width="12" height="12" rx="3" class="tile"/><rect x="18" y="32" width="12" height="12" rx="3" class="tile"/><rect x="32" y="32" width="12" height="12" rx="3" class="tile"/>
          <text x="10" y="12.8" class="digit">4</text><text x="38" y="12.8" class="digit">2</text><text x="24" y="26.8" class="digit on">1</text>
          <text x="10" y="40.8" class="digit">3</text><text x="38" y="40.8" class="digit">5</text>
        </svg>
        <span class="name">차례</span>
        <span class="desc">1부터 차례로 누르기 · 300판</span>
      </a>
      <a class="card" href="chulcha/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="3" y="3" width="42" height="42" rx="7" class="lot"/>
          <rect x="7" y="7" width="8" height="16" rx="3" fill="#5b7fa6"/>
          <rect x="17" y="7" width="24" height="8" rx="3" fill="#6f9a7a"/>
          <rect x="17" y="19.5" width="16" height="9" rx="3" fill="#f2b630"/>
          <rect x="35" y="17" width="8" height="24" rx="3" fill="#a3785b"/>
          <rect x="7" y="33" width="24" height="8" rx="3" fill="#8a76a8"/>
          <path d="M45 19.5v9" class="gap"/>
        </svg>
        <span class="name">출차</span>
        <span class="desc">블록을 밀어 길 열기 · 500판</span>
      </a>
      <a class="card" href="baseball/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="3" y="10" width="12" height="16" rx="3" class="tile"/><rect x="18" y="10" width="12" height="16" rx="3" class="tile"/><rect x="33" y="10" width="12" height="16" rx="3" class="tile"/>
          <text x="9" y="22" class="digit">3</text><text x="24" y="22" class="digit">7</text><text x="39" y="22" class="digit">1</text>
          <circle cx="12" cy="37" r="5" fill="#2f9e5b"/><circle cx="24" cy="37" r="5" fill="#e09a12"/><circle cx="36" cy="37" r="5" class="tile"/>
        </svg>
        <span class="name">숫자야구</span>
        <span class="desc">스트라이크·볼로 숫자 맞히기</span>
      </a>
      <a class="card" href="lights/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="4" width="12" height="12" rx="3" fill="#f5c542"/><rect x="18" y="4" width="12" height="12" rx="3" class="off"/><rect x="32" y="4" width="12" height="12" rx="3" fill="#f5c542"/>
          <rect x="4" y="18" width="12" height="12" rx="3" class="off"/><rect x="18" y="18" width="12" height="12" rx="3" fill="#f5c542"/><rect x="32" y="18" width="12" height="12" rx="3" class="off"/>
          <rect x="4" y="32" width="12" height="12" rx="3" class="off"/><rect x="18" y="32" width="12" height="12" rx="3" fill="#f5c542"/><rect x="32" y="32" width="12" height="12" rx="3" class="off"/>
        </svg>
        <span class="name">불 끄기</span>
        <span class="desc">눌러서 모든 불 끄기 · 300판</span>
      </a>
      <a class="card" href="bridges/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M10 10H38M10 10V38M35 36H13" class="bridge"/><path d="M36 13V35M40 13V35" class="bridge thin"/>
          <circle cx="10" cy="10" r="7" class="isle"/><circle cx="38" cy="10" r="7" class="isle"/><circle cx="10" cy="38" r="7" class="isle"/><circle cx="38" cy="38" r="7" class="isle"/>
          <text x="10" y="12.8" class="digit">2</text><text x="38" y="12.8" class="digit">3</text><text x="10" y="40.8" class="digit">2</text><text x="38" y="40.8" class="digit">3</text>
        </svg>
        <span class="name">다리 놓기</span>
        <span class="desc">섬의 숫자만큼 다리 잇기 · 300판</span>
      </a>
      <a class="card" href="pairs/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="6" width="12" height="16" rx="3" fill="#2f5bd3"/><rect x="18" y="6" width="12" height="16" rx="3" class="tile"/><rect x="32" y="6" width="12" height="16" rx="3" fill="#2f5bd3"/>
          <rect x="4" y="26" width="12" height="16" rx="3" fill="#2f5bd3"/><rect x="18" y="26" width="12" height="16" rx="3" fill="#2f5bd3"/><rect x="32" y="26" width="12" height="16" rx="3" class="tile"/>
          <circle cx="24" cy="14" r="3.5" fill="#e4574f"/><circle cx="38" cy="34" r="3.5" fill="#e4574f"/>
        </svg>
        <span class="name">짝 맞추기</span>
        <span class="desc">같은 그림 카드 찾기 · 70판</span>
      </a>
    </nav>
  </main>
  <script>navigator.serviceWorker?.register('sw.js').catch(() => {});</script>
</body>
</html>
