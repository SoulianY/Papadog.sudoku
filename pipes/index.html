<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#d7e2e4">
  <title>파이프 잇기</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="home" hidden>
    <header class="bar">
      <a class="hub" href="../" aria-label="게임 목록">‹</a>
      <h1>파이프 잇기</h1>
      <span></span>
    </header>
    <ul class="intro">
      <li>칸을 누르면 파이프가 시계 방향으로 돌아가요.</li>
      <li>가운데 큰 동그라미(수원)에서 물이 모든 파이프로 흐르게 이으세요.</li>
      <li>새는 곳(아무 데도 안 이어진 끝)이 없어야 완성이에요.</li>
    </ul>
    <div class="progress">
      <div class="progress-bar"><span></span></div>
      <span class="progress-text"></span>
    </div>
    <button class="continue primary"></button>
    <div class="sections"></div>
  </main>

  <main id="play" hidden>
    <header class="bar">
      <button class="back" aria-label="단계 목록">‹</button>
      <div class="title">
        <h1 class="stage-title"></h1>
        <span class="stage-sub"></span>
      </div>
      <span></span>
    </header>
    <section class="status">
      <div><span class="label">돌린 횟수</span><span class="taps">0</span></div>
      <div><span class="label">물 닿은 칸</span><span class="wet-count">0</span></div>
    </section>
    <div class="grid"></div>
    <div class="controls">
      <button class="reset">처음부터</button>
    </div>
    <div class="win" hidden>
      <div class="win-card">
        <h2>물이 다 흘러요!</h2>
        <p class="win-taps"></p>
        <button class="next primary">다음 단계</button>
        <button class="again">다시 하기</button>
        <button class="to-list">단계 목록</button>
      </div>
    </div>
  </main>
</body>
</html>
