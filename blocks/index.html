<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>블록 퍼즐</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main class="game">
    <header class="bar">
      <a class="back" href="../" aria-label="게임 목록">‹</a>
      <h1>블록 퍼즐</h1>
      <button class="restart" aria-label="새 게임">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>
    <section class="scoreboard">
      <div class="score">0</div>
      <div class="best"></div>
      <div class="combo" aria-live="polite"></div>
    </section>
    <div class="board"></div>
    <div class="tray"></div>
  </main>
  <dialog class="over">
    <h2>게임 끝</h2>
    <p class="final"></p>
    <p class="final-best"></p>
    <button class="again" autofocus>다시 하기</button>
  </dialog>
</body>
</html>
